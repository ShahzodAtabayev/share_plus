pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }

        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty() || !file(flutterSdkPath).exists()) {
            flutterSdkPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
        }

        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty() || !file(flutterSdkPath).exists()) {
            throw new GradleException(
                "Flutter SDK not found. Set flutter.sdk in local.properties or set FLUTTER_ROOT/FLUTTER_HOME."
            )
        }

        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.1" apply false
}

include ":app"
